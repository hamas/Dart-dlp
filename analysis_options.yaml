analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**


linter:
  rules:
    - always_declare_return_types
    - camel_case_types
    - empty_catches
    - file_names
    - library_names
    - library_prefixes
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
